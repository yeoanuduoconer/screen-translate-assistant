[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-translate-assistant"
version = "0.1.0"
description = "Windows screen OCR and translation overlay assistant"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "httpx==0.28.1",
  "numpy==2.3.5",
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.1",
  "paddlex[ocr-core]==3.7.2",
  "Pillow==12.3.0",
  "pydantic==2.13.4",
  "PySide6==6.11.1",
]

[project.scripts]
screen-translator = "screen_translator.app:main"

[project.optional-dependencies]
fast-ocr = ["onnxruntime==1.24.4"]
dev = ["pytest==9.1.1", "ruff==0.15.21"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
